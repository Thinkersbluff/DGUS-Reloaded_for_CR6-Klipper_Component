    RESPOND PREFIX="Y_TMC_RESULT" MSG="stealth flag — expect stealth=0 (spreadCycle active). stealth=1 means stealthChop is running instead."
    RESPOND PREFIX="Y_TMC_RESULT" MSG="GSTAT — expect 0x00000000. Non-zero means a driver fault or undervoltage reset occurred during the test."
