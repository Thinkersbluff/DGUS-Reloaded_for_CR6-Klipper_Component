    RESPOND PREFIX="Y_TMC_RESULT" MSG="cs_actual — effective current scale (0-31). Should match irun from IHOLD_IRUN during motion."
    RESPOND PREFIX="Y_TMC_RESULT" MSG="======================================"

    # --- Restore original stealthchop thresholds via INIT_TMC (replays printer.cfg to the driver) ---
    {% if sc_x != 0 %}
        RESPOND PREFIX="Y_TRAVEL_TEST_WITH_TMC" MSG="Restoring stepper_x via INIT_TMC"
        INIT_TMC STEPPER=stepper_x
    {% else %}
        RESPOND PREFIX="Y_TRAVEL_TEST_WITH_TMC" MSG="stepper_x: no restore needed (threshold was already 0)"
    {% endif %}
    {% if sc_y != 0 %}
        RESPOND PREFIX="Y_TRAVEL_TEST_WITH_TMC" MSG="Restoring stepper_y via INIT_TMC"
        INIT_TMC STEPPER=stepper_y
    {% else %}
        RESPOND PREFIX="Y_TRAVEL_TEST_WITH_TMC" MSG="stepper_y: no restore needed (threshold was already 0)"
    {% endif %}
    RESPOND PREFIX="Y_TRAVEL_TEST_WITH_TMC" MSG="Test complete."

[gcode_macro CLEAN_NOZZLE]
description: Cleans the nozzle by wiping across a brush in a zig-zag pattern
variable_nozzle_temp: 145
variable_start_x: 252
variable_end_x: 257
variable_start_y: 0
variable_end_y: 36
variable_transit_z: 10
variable_start_z: 1.1
variable_wipe_qty: 6
variable_zag_count: 3
variable_wipe_spd: 200     # mm/s
variable_lift_after: 10

gcode:
    ##### Resolve parameters or defaults #####
    {% set start_x    = params.start_x   | default(start_x)    | float %}
    {% set end_x      = params.end_x     | default(end_x)      | float %}
    {% set start_y    = params.start_y   | default(start_y)    | float %}
    {% set end_y      = params.end_y     | default(end_y)      | float %}
    {% set transit_z  = params.transit_z | default(transit_z)  | float %}
    {% set start_z    = params.start_z   | default(start_z)    | float %}
    {% set wipe_qty   = params.wipe_qty  | default(wipe_qty)   | int %}
    {% set zag_count  = params.zag_count | default(zag_count)  | int %}
    {% set wipe_spd   = params.wipe_spd  | default(wipe_spd)   | float %}
    {% set lift_after = params.lift_after| default(lift_after) | float %}

    ##### Ensure homed #####
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    ##### Reset planner state so wiping always runs at full speed #####
    M400
    SET_VELOCITY_LIMIT

    ##### Save state #####
    SAVE_GCODE_STATE NAME=clean_state

    G90

    ##### Move to brush entry #####
    G1 X{start_x-7} Y{start_y} Z{transit_z} F6000

    ##### Heat nozzle if needed #####
    {% set initial_target = printer.extruder.target|float %}
    {% set min_temp = nozzle_temp|float %}
    {% set target_temp = [initial_target, min_temp]|max %}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={target_temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target_temp-1}

    ##### Drop to cleaning Z #####
    G1 Z{start_z} F6000

    ##### Compute X step #####
    {% set dx = (end_x - start_x) / ([zag_count - 1, 1]|max) %}

    ##### Perform zig-zag wipes #####
    {% for pass in range(wipe_qty) %}
        {% for col in range(zag_count) %}
            {% set abs_step = pass * zag_count + col %}
            {% if pass % 2 == 0 %}
                {% set x_pos = start_x + col * dx %}
            {% else %}
                {% set x_pos = start_x + (zag_count - 1 - col) * dx %}
            {% endif %}
            {% set y_pos = end_y if abs_step % 2 == 0 else start_y %}

            G1 X{x_pos} F{wipe_spd * 60}
            G1 Y{y_pos} F{wipe_spd * 60}
        {% endfor %}
    {% endfor %}

    ##### Return to brush entry #####
    G1 X{start_x} Y{start_y} F{wipe_spd * 60}

    ##### Lift nozzle #####
    G1 Z{start_z + lift_after} F6000

    ##### Restore state #####
    RESTORE_GCODE_STATE NAME=clean_state

    ##### Restore original nozzle temp #####
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={initial_target}
    {% if initial_target > 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={initial_target - 2}
    {% endif %}


#####################################################
############   END OF   MACROS   ####################
#####################################################