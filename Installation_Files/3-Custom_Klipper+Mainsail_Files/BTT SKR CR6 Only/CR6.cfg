[gcode_macro LOAD_FILAMENT]
description:  MUST HEAT NOZZLE BEFORE RUNNING THIS. Ensures Z>=30mm. Loads filament, then retracts 0.5mm.
gcode:
  M300
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < 30.0 %}
    G0 Z30
  {% endif %}
  SAVE_GCODE_STATE NAME=before_load_filament_state
  M83                            ; set extruder to relative
  G1 E45 F1000                  ; quickly load filament set for direct drive, for bowden set to E280
  G1 E30 F300                    ; slower extrusion for hotend path
  G1 E50 F150                    ; prime nozzle with filament
  #TURN_OFF_HEATERS
  G1 E-0.5 F500						; retract a bit
  #G1 E-1 F5						; retract a bit
  #M82                            ; set extruder to absolute
  RESTORE_GCODE_STATE NAME=before_load_filament_state
  M300
  M300

[gcode_macro M204]
rename_existing: M204.1
gcode:
  {% if params.S is defined %}
    {% set s = params.S|float %}
    SET_VELOCITY_LIMIT ACCEL={s} ACCEL_TO_DECEL={s/2}
  {% endif %}

[gcode_macro M900]
gcode:
  {% if params.K is defined %}
    {% set K = params.K|float %}
    SET_PRESSURE_ADVANCE ADVANCE={K}
  {% endif %}

[gcode_macro X_TRAVEL_TEST]
description: "Rapid X-axis travel test with state save/restore"
variable_orig_velocity: 0
variable_orig_accel: 0
gcode:
  # --- Snapshot current runtime limits once ---
    {% set v = printer['toolhead'].max_velocity %}
    {% set a = printer['toolhead'].max_accel %}
    {% set cfg_v = printer['configfile'].settings.printer.max_velocity|float %}
    {% set cfg_a = printer['configfile'].settings.printer.max_accel|float %}
    {% set test_v = [v, cfg_v]|max %}
    {% set test_a = [a, cfg_a]|max %}
    RESPOND PREFIX="X_TRAVEL_TEST" MSG="Read toolhead: max_velocity={v}, max_accel={a}"

    # --- Home XYZ ---
    G28

    # --- Raise Z for safety ---
    G91
    G1 Z5 F3000
    G90

    # --- Apply test limits ---
    RESPOND PREFIX="X_TRAVEL_TEST" MSG="Applying test limits: velocity={test_v}, accel={test_a}"
    SET_VELOCITY_LIMIT VELOCITY={test_v} ACCEL={test_a}

    # --- Move to left edge ---
    G1 X10 F6000

    # --- Run rapid cycles ---
    {% for i in range(20) %}
        G1 X230 F18000
        G1 X10  F18000
    {% endfor %}

    # --- Restore original limits ---
    RESPOND PREFIX="X_TRAVEL_TEST" MSG="Restoring from local snapshot: velocity={v}, accel={a}"
    SET_VELOCITY_LIMIT VELOCITY={v} ACCEL={a}

[gcode_macro Y_TRAVEL_TEST]
description: "Rapid Y-axis travel test with state save/restore"
variable_orig_velocity: 0
variable_orig_accel: 0
gcode:
  # --- Snapshot current runtime limits once ---
    {% set v = printer['toolhead'].max_velocity %}
    {% set a = printer['toolhead'].max_accel %}
    {% set cfg_v = printer['configfile'].settings.printer.max_velocity|float %}
    {% set cfg_a = printer['configfile'].settings.printer.max_accel|float %}
    {% set test_v = [v, cfg_v]|max %}
    {% set test_a = [a, cfg_a]|max %}
    RESPOND PREFIX="Y_TRAVEL_TEST" MSG="Read toolhead: max_velocity={v}, max_accel={a}"

    # --- Home XYZ ---
    G28

    # --- Raise Z for safety ---
    G91
    G1 Z5 F3000
    G90

    # --- Apply test limits ---
    RESPOND PREFIX="Y_TRAVEL_TEST" MSG="Applying test limits: velocity={test_v}, accel={test_a}"
    SET_VELOCITY_LIMIT VELOCITY={test_v} ACCEL={test_a}

    # --- Move X to center ---
    G1 X117 F6000

    # ---Home Y-axis --- 
    G28 Y

    # --- Run rapid cycles ---
    {% for i in range(20) %}
        G1 Y230 F18000
        G1 Y10  F18000
    {% endfor %}

    # --- Restore original limits ---
    RESPOND PREFIX="Y_TRAVEL_TEST" MSG="Restoring from local snapshot: velocity={v}, accel={a}"
    SET_VELOCITY_LIMIT VELOCITY={v} ACCEL={a}

######################################################################
# TMC diagnostics helpers
# NOTE: Requires UART-connected TMC drivers (BTT SKR board).
#       Will fail silently or error on standalone (step/dir-only) boards.
######################################################################

[gcode_macro TMC_SNAPSHOT]
description: Dump TMC2209 status for stepper_x and stepper_y to the console.
gcode:
    {% set label = params.LABEL|default("") %}
    RESPOND PREFIX="TMC_SNAPSHOT" MSG="--- {label} ---"
    DUMP_TMC STEPPER=stepper_x
    DUMP_TMC STEPPER=stepper_y
    RESPOND PREFIX="TMC_SNAPSHOT" MSG="--- end {label} ---"

[gcode_macro X_TRAVEL_TEST_WITH_TMC]
description: "X travel stress test with TMC snapshots and spreadCycle forced during moves"
gcode:
    # --- Read configured stealthchop thresholds from printer.cfg ---
    {% set sc_x = printer['configfile'].settings['tmc2209 stepper_x'].stealthchop_threshold|int %}
    {% set sc_y = printer['configfile'].settings['tmc2209 stepper_y'].stealthchop_threshold|int %}

    # --- Pre-test TMC snapshot ---
    TMC_SNAPSHOT LABEL="X_TRAVEL_TEST pre-test"

    # --- Force spreadCycle on X and Y ---
    # NOTE: In the TMC2209 hardware register, TPWMTHRS=1048575 (0xFFFFF) means "always spreadCycle".
    #       TPWMTHRS=0 means "always stealthChop" — the opposite of what the name implies.
    #       Klipper writes TPWMTHRS=1048575 when stealthchop_threshold=0 in printer.cfg.
    {% if sc_x == 0 %}
        RESPOND PREFIX="X_TRAVEL_TEST_WITH_TMC" MSG="stepper_x: stealthchop_threshold=0, already always-spreadCycle (TPWMTHRS=1048575) — no write needed"
    {% else %}
        RESPOND PREFIX="X_TRAVEL_TEST_WITH_TMC" MSG="stepper_x: forcing spreadCycle (TPWMTHRS=1048575) — configured threshold was {sc_x}"
        SET_TMC_FIELD STEPPER=stepper_x FIELD=TPWMTHRS VALUE=1048575
    {% endif %}
    {% if sc_y == 0 %}
        RESPOND PREFIX="X_TRAVEL_TEST_WITH_TMC"  MSG="stepper_y: stealthchop_threshold=0, already always-spreadCycle (TPWMTHRS=1048575) — no write needed"
    {% else %}
        RESPOND PREFIX="X_TRAVEL_TEST_WITH_TMC" MSG="stepper_y: forcing spreadCycle (TPWMTHRS=1048575) — configured threshold was {sc_y}"
        SET_TMC_FIELD STEPPER=stepper_y FIELD=TPWMTHRS VALUE=1048575
    {% endif %}

    # --- Run the base travel test ---
    X_TRAVEL_TEST

    # --- Post-test TMC snapshot (while drivers may still show stress state) ---
    TMC_SNAPSHOT LABEL="X_TRAVEL_TEST post-test"

    # --- Result interpretation guide ---
    RESPOND PREFIX="X_TMC_RESULT" MSG="=== How to read the snapshot above ==="
    RESPOND PREFIX="X_TMC_RESULT" MSG="DRV_STATUS flags — PASS: none of these present | WARN: otpw=1 (overtemp pre-warning) | FAIL: ot=1 (overtemp), s2ga=1/s2gb=1 (short-to-GND), ola=1/olb=1 (open load)"
    RESPOND PREFIX="X_TMC_RESULT" MSG="stealth flag — expect stealth=0 (spreadCycle active). stealth=1 means stealthChop is running instead."
    RESPOND PREFIX="X_TMC_RESULT" MSG="GSTAT — expect 0x00000000. Non-zero means a driver fault or undervoltage reset occurred during the test."
    RESPOND PREFIX="X_TMC_RESULT" MSG="sg_result (StallGuard load) — 0=stall, higher=more load headroom. Note: SGTHRS=0 so no automatic stall action is configured."
    RESPOND PREFIX="X_TMC_RESULT" MSG="cs_actual — effective current scale (0-31). Should match irun from IHOLD_IRUN during motion."
    RESPOND PREFIX="X_TMC_RESULT" MSG="======================================"

    # --- Restore original stealthchop thresholds via INIT_TMC (replays printer.cfg to the driver) ---
    {% if sc_x != 0 %}
        RESPOND PREFIX="X_TRAVEL_TEST_WITH_TMC" MSG="Restoring stepper_x via INIT_TMC"
        INIT_TMC STEPPER=stepper_x
    {% else %}
        RESPOND PREFIX="X_TRAVEL_TEST_WITH_TMC" MSG="stepper_x: no restore needed (threshold was already 0)"
    {% endif %}
    {% if sc_y != 0 %}
        RESPOND PREFIX="X_TRAVEL_TEST_WITH_TMC" MSG="Restoring stepper_y via INIT_TMC"
        INIT_TMC STEPPER=stepper_y
    {% else %}
        RESPOND PREFIX="X_TRAVEL_TEST_WITH_TMC" MSG="stepper_y: no restore needed (threshold was already 0)"
    {% endif %}
    RESPOND PREFIX="X_TRAVEL_TEST_WITH_TMC" MSG="Test complete."

