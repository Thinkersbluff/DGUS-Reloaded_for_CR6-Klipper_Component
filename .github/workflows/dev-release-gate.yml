name: Dev Release Gate

on:
  pull_request:
    branches:
      - New-At-1.4.4
  push:
    branches:
      - New-At-1.4.4

jobs:
  pre-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run pre-release checks
        shell: pwsh
        run: |
          $version = "1.4.4"
          $claims = "Development_Project_Files/Development_Docs/Verification/Claims_v1.4.4.md"
          ./Development_Project_Files/Development_Docs/Scripts/Invoke-PreReleaseGate.ps1 -Version $version -ClaimsFile $claims -CI