name: Dev Release Gate

on:
  pull_request:
    branches:
      - New-At-2.0.0
  push:
    branches:
      - New-At-2.0.0

jobs:
  pre-release-gate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run pre-release checks
        shell: pwsh
        run: |
          $version = "2.0.0"
          $claims = "Development_Project_Files/Development_Docs/Verification/Claims_v2.0.0.md"
          ./Development_Project_Files/Development_Docs/Scripts/Invoke-PreReleaseGate.ps1 -Version $version -ClaimsFile $claims -CI