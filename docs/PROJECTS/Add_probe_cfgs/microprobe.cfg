## DOWNLOADED from : https://gist.github.com/utlandr/c3dab6bbcca1fc19dfc402d81cfd75e4
## Modified by Thinkersbluff, to work with the Creality CR6 motherboard part number 4.5.2
## as part of the DGUS-Reloaded for CR6 Klipper Component
## --- BIQU Microprobe Klipper configuration ---
# Not much different from a standard probe config. The main difference compared to most probes is NOT
# deactivating the probe (PROBE_UP) after each sample
#
# Note: if you are changing from a bltouch or one of its clones, remove/comment out the [bltouch] config!
# That also includes any auto generated config stored at the bottom by the PROBE_CALIBRATE command
#
# Note: the current control and sensor pin values are configured for the Creality 4.5.2 motherboard. 
# Users of other boards will need to update these values depending on their controller board model.
#
# NOTE: This file is configured for the V2 microprobe. 
# V1 users must update the polarity of the sensor pin in the config to be pull-up (^) not pull down (^!)

### NB: You must measure the x and y offset values of your probe installation and update this file accordingly!
## You must also calibrate the Z offset and SAVE_CONFIG to update the value stored in printer.cfg.
## See: https://www.klipper3d.org/Probe_Calibrate.html for instructions

## ALSO: RUN the ABL macros before printing

## Vendor's Reference for BTT MicroProbe : https://github.com/bigtreetech/MicroProbe/tree/master


[output_pin probe_enable]
pin: PA3  # Assumes using reserved connector J30 on 4.5.2 board to command the probe servo
value: 0  # Ensures that the probe tip is retracted by default, until probing is commanded.

[probe]
pin: ^!PC6  # Assumes using what was the Optical Switch signal pin, as the probe signal input
# NOTE FOR V1 users: Set pin: to ^PC6 to set the low level trigger 
deactivate_on_each_sample: False
x_offset: -40  # Edit this to the correct value for your installation. Then edit the home_zy_position in [safe_z_home], below
y_offset: -35  # Edit this to the correct value for your installation
#z_offset must remain in the [probe] section of printer.cfg, to ensure that it is overridden and saved in printer.cfg when you do a PROBE_CALIBRATE and SAVE_ CONFIG
samples: 2  # Edit to your personal taste
samples_tolerance: 0.05  # Edit to your personal taste
samples_tolerance_retries: 3  # Edit to your personal taste
activate_gcode:
    PROBE_DOWN
    G4 P500
deactivate_gcode:
    PROBE_UP

[gcode_macro PROBE_DOWN]
gcode:
    SET_PIN PIN=probe_enable VALUE=1

[gcode_macro PROBE_UP]
gcode:
    SET_PIN PIN=probe_enable VALUE=0

[safe_z_home]
home_xy_position: 117.5,117.5  # Edit these values to specify where the nozzle will be, when the probe is at the center of the bed.
speed: 100
z_hop: 10  # Hop high enough to ensure that the extended probe tip clears any obstacles, if homing with object(s) on the bed