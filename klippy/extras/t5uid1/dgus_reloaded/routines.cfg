[t5uid1_routine message_timeout]
# Clear the displayed message field, after <delay> seconds
trigger: manual
delay: 10
script: {% do set_message("") %}

[t5uid1_routine print_start]
trigger: manual
delay: 0
script: {% do switch_page("print_status") %}

[t5uid1_routine print_end]
trigger: manual
delay: 0
script:
  {% set sound = printer.t5uid1.notification_sound %}
  {% if sound >= 0 %}
    {% do play_sound(sound) %}
  {% endif %}
  # Reset feedrate and flowrate multipliers, to solve Issue 47
  M220 S100
  M221 S100
  {% do switch_page("print_finished") %}
run_as_gcode: true

[t5uid1_routine trigger_full_update]
trigger: manual
delay: 0
script: 
  {% if not is_busy() %}
    {% do full_update() %}
  {% endif %}

[t5uid1_routine show_wait_screen]
trigger: manual
delay: 0
script: {% do switch_page("wait") %}

[t5uid1_routine show_probing_screen]
trigger: manual
delay: 0
script: 
  {% do set_variable("line1","Now running macro") %}
  {% do set_variable("line2", (get_variable("current_macro_name"))) %}
  {% do switch_page("leveling_probing") %}

[t5uid1_routine reset_bltouch]
trigger: manual
script:
  {% if printer.t5uid1.has_bltouch %}
    BLTOUCH_DEBUG COMMAND=reset
    BLTOUCH_DEBUG COMMAND=pin_up
  {% endif %}
run_as_gcode: true

[t5uid1_routine __wait_return]
trigger: enter
page: wait
interval: 1
script:
  {% if not is_busy() %}
    {% set sound = get_variable("wait_return_sound", -1) %}
    {% if sound >= 0 and sound <= 255 %}
      {% do set_variable("wait_return_sound", -1) %}
      {% do play_sound(sound) %}
    {% endif %}
    {% set page = get_variable("wait_return", "")|default("home", true) %}
    {% do set_variable("wait_return", "") %}
    {% do switch_page(page) %}
  {% endif %}

[t5uid1_routine __probing_return]
trigger: enter
page: leveling_probing
interval: 1
script:
  {% if not is_busy() %}
    {% set sound = printer.t5uid1.notification_sound %}
    {% if sound >= 0 %}
      {% do play_sound(sound) %}
    {% endif %}
    {% do switch_page("leveling_automatic") %}
    {% do set_message("Use SAVE_CONFIG if is OK") %}
  {% endif %}

[t5uid1_routine __boot]
# At boot time:
#  1. Set the state of the RunOut sensor according to the last state saved in variables.cfg
#  2. Set the Files Scroll Index value to 0
trigger: enter
page: boot
delay: 3
script: 
  {% do switch_page("home") %}
  # Klipper automatically enables the RunoutSensor, with printer.cfg setup to Pause at Runout = True
  # Rather than ask the user to edit printer.cfg each time they change their minds, this script 
  # restores the last selected Runout Sensor state (Enabled=1 or Disabled=0) in variables.cfg
  {% if not 'save_variables' in printer %}
    {% do set_message("[save_variables] not found") %}
  {% else %}
    SET_FILAMENT_SENSOR
    G4 P2500
  {% endif %}
  {% do set_variable("scroll_index", 0) %}
  {% set preset_value = get_preset_values("unload_filament_after_print", none) | int %}
  {% if preset_value == 1 %}
    {% do set_variable("unload_filament_after_print", 1) %}
    SAVE_VARIABLE VARIABLE=unload_filament_after_print VALUE=1
  {% elif preset_value == 0 %}
    {% do set_variable("unload_filament_after_print", 0) %}
    SAVE_VARIABLE VARIABLE=unload_filament_after_print VALUE=0
  {% else %}
    M117 Auto Unload needs Setup!
  {% endif %}
  M117 Printer Ready
run_as_gcode: true

[t5uid1_routine __print_status_pause]
# Use t5uid1.check_paused function to switch the display from print_status to paused_print when print is paused - whether by button press or by macro
# NOTE: At v1.2.6, removed do switch_page() from here, to avoid a display page toggling conflict with the t5uid1.check_paused function
# Also shortened the interval from 5 to 2, to speed-up the page change
trigger: enter
page: print_status
interval: 2
script: {% do check_paused() %}

[t5uid1_routine __paused_print]
# Do not increment print elapsed time while print is paused
# Use t5uid1.check_paused function to switch the display back from paused_print to print_status page, when print is resumed
# NOTE: At v1.2.6, removed do switch_page() from here, to avoid a display page toggling conflict with the t5uid1.check_paused function
# Also shortened the interval from 5 to 2, to speed-up the page change
trigger: enter
page: print_paused
interval: 2
script: {% do check_paused() %}

[t5uid1_routine __print_adjust_resume]
# Do not measure print elapsed time while print is paused AND on Tune menu
trigger: enter
page: paused_print_adjust
interval: 5
script: {% do check_paused() %}

[t5uid1_routine __move]
# If the printer is "Busy", abort the switch to the Move page
# Else, select the 10mm step size as the default move increment
trigger: enter_pre
page: move
script:
  {% if is_busy() %}
    {% do set_message("Busy") %}
    { abort_page_switch() }
  {% else %}
    {% do set_variable("move_steps", printer.t5uid1.constants.step_size_10) %}
  {% endif %}

[t5uid1_routine __leveling_menu]
