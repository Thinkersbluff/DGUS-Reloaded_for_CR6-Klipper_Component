[t5uid1_routine __leveling_automatic]
trigger: enter_pre
page: leveling_automatic
script:
  {% if is_busy() %}
    {% do set_message("Busy") %}
    { abort_page_switch() }
  {% elif 'bed_mesh' not in printer %}
    {% do set_message("Missing config: bed_mesh") %}
    { abort_page_switch() }
  {% elif 'probe' not in printer %}
    {% do set_message("Missing config: probe") %}
    { abort_page_switch() }
  {% else %}
    {% set profiles_keys = printer['bed_mesh'].profiles.keys() %}
    {% do set_variable("printer_profile_names",profiles_keys) %}
    {% set presets_macro_names = [] %}
    {% set presets_profile_names = [] %}
    {% do get_abl_profiles(presets_macro_names, presets_profile_names) %}
    {% do set_variable("abl_macro_list", presets_macro_names) %}
    {% do set_variable("abl_profile_list", presets_profile_names) %}
    {% do set_variable("profile_index", 0) %}
    {% do set_variable("macro_index", 0) %}
  {% endif %}


[t5uid1_routine __capture_Virtual_SD_Filenames]
trigger: enter_pre
page: print_menu
interval: 2
script: {% do capture_gcode_files('~/printer_data/gcodes') %}

[t5uid1_routine __build_macros_menu]
trigger: enter_pre
page: macros
interval: 2
script:
  {% set macro_menu_section = get_variable("macro_menu_section") %}
  {% set macro_menu_names = capture_macros_list(macro_menu_section) or [] %}
  M118 Raw Registration Status { get_macro_registration_status(macro_menu_names) }
  {% set macro_registration_status = get_macro_registration_status(macro_menu_names) or [] %}
  {% set max_visible_lines = 9 %}
  {% do set_variable("macro_menu_names", macro_menu_names) %} 
  {% do set_variable("macro_registration_status", macro_registration_status) %}    
  {% do set_variable("macro_menu_index", 0) %}
  {% do set_variable("highlighted_index", 0) %}
  {% do set_variable("visible_start", 0) %} 
  {% do set_variable("max_visible_lines", max_visible_lines) %}
  {% do set_variable("page_number", 1) %}
  {% set number_of_pages = (macro_menu_names|length + max_visible_lines - 1) // max_visible_lines %}
  {% do set_variable("number_of_pages", number_of_pages) %}
  M118 Menu { macro_menu_section } Count { macro_menu_names|length }
  M118 Registered { macro_registration_status|length }
  M117 Page { get_variable("page_number") } of { number_of_pages }
  {% do start_routine("trigger_full_update") %} # Refresh displayed variables on page
run_as_gcode: true

