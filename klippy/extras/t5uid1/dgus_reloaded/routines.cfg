[t5uid1_routine __calibrate_rotation_distance]
trigger: enter_pre
page: RotDist_Test
script:
  {% if is_busy() %}
    {% do set_message("Busy") %}
    { abort_page_switch() }
  {% else %}
    {% set current_rotation_dist = (get_printer_cfg_value("extruder", "rotation_distance") or "0.00") | round_up("0.01") %}
    {% set minimum_extrude_temp = get_printer_cfg_value("extruder", "min_extrude_temp")|int %}
    {% if current_rotation_dist == 0 %}
      M117 "not found: extruder rotation distance"  # Display Error message on printer LCD
    {% elif minimum_extrude_temp == 0 %}
      M117 "not found: min extrusion temp"  # Display Error message on printer LCD
    {% else %}
      {% do set_variable("current_rotation_distance", current_rotation_dist) %}
      {% do set_variable("min_extrusion_temp", minimum_extrude_temp + 5) %} # Add 5 deg buffer to min temp, to avoid error if temp varies below min value
      {% do set_variable("requested_extrude_distance", 100)|int %} # Set default to speed workflow
      {% do set_variable("initial_mark_distance", 120)|int %} # Set default to speed workflow
      {% do set_variable("subsequent_mark_distance", 20)|int %}  # set default to avoid "not defined" errors on 1st load of results page
      {% do set_variable("extrusion_path", 1)|int %} # set default to avoid "not defined" errors on 1st load of results page      
      {% do start_routine("trigger_full_update") %} # Refresh displayed variables on page (maybe redundant?)
      {% if printer.extruder.target|round|int < get_variable("min_extrusion_temp") %}
        M117 Set Temperature >= Min
      {% endif %}
    {% endif %}
  {% endif %}
run_as_gcode: true

[t5uid1_routine __test_rotation_distance]
trigger: enter_pre
page: RotDist_Results
script:
  {% if is_busy() %}
    {% do set_message("Busy") %}
    { abort_page_switch() }
  {% else %}
    {% do start_routine("compute_rotation_distance") %}
  {% endif %}

[t5uid1_routine compute_rotation_distance]
trigger: manual
script:
  {% if is_busy() %}
    {% do set_message("Busy") %}
    { abort_page_switch() }
  {% else %}
    {% set current_rotation_dist = (get_printer_cfg_value("extruder", "rotation_distance")) | round_up("0.001") %}
    {% do set_variable("current_rotation_distance", current_rotation_dist) %}
    {% set previous_rotation_dist = get_variable("current_rotation_distance") | float %}
    {% set requested_extrude_dist = get_variable("requested_extrude_distance") | float %}
    {% set initial_mark_dist = get_variable("initial_mark_distance") | float %}
    {% set subsequent_mark_dist = get_variable("subsequent_mark_distance",initial_mark_dist - requested_extrude_dist) | float %}
    {% set actual_extrude_dist = initial_mark_dist - subsequent_mark_dist | float %}
    {% set new_rotation_dist = (previous_rotation_dist * actual_extrude_dist / requested_extrude_dist) | round_up("0.001") %}
    {% do set_variable("new_rotation_distance", new_rotation_dist) %}
  {% endif %}