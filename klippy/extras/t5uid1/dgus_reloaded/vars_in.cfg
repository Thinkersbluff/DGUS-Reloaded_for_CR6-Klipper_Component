script:
  {% set flen = data %}
  M300 S255 P255
  M300 S255 P255
  M300 S255 P255
  {% set t5uid1 = printer.t5uid1 %}
  {% set extruder = get_variable("filament_extruder",
                                 t5uid1.constants.extruder_current) %}
