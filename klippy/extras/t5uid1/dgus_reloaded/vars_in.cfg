[t5uid1_var __subsequent_mark_distance]
type: input
address: 0x2040
data_type: uint16
script: 
  {% do set_variable("subsequent_mark_distance", data) %}  # Remove redundant |float
  {% set previous_rotation_dist = get_variable("current_rotation_distance", 0) | float %}
  {% set requested_extrude_dist = get_variable("requested_extrude_distance", 1) | float %}
  {% set initial_mark_dist = get_variable("initial_mark_distance", 0) | float %}
  {% set subsequent_mark_dist = get_variable("subsequent_mark_distance", 0) | float %}
  {% set actual_extrude_dist = initial_mark_dist - subsequent_mark_dist %}  # No need for another |float
  {% set new_rotation_dist = (previous_rotation_dist * actual_extrude_dist / requested_extrude_dist) | round(3) %}  # Remove unnecessary |float
  {% do set_variable("new_rotation_distance", new_rotation_dist) %}

