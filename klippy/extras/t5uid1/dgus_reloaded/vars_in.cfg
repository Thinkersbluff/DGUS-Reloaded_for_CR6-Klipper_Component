[t5uid1_var __extrude_requested_distance]
type: input
address: 0x2027
data_type: uint16
script:
  {% if is_busy() %}
    {% do set_message("Busy") %}
  {% else %}
    {% set ext_name = printer.toolhead.extruder %}
    {% set path = get_variable("extrusion_path")|int %}
    {% if printer[ext_name].temperature < get_variable("min_extrusion_temp")-2 %} # Allow max -2 below target temperature
      {% do set_message("Temperature too low") %}
      M300 S255 P255
      M300 S255 P255
    {% elif get_variable("initial_mark_distance") < get_variable("requested_extrude_distance") %}
      {% do set_message("Mark Dist. < Extrusion Dist.") %}
      M300 S255 P255
      M300 S255 P255
    {% else %}
    SAVE_GCODE_STATE NAME=state_extrude_requested_amount
    M300 S255 P50
    ACTIVATE_EXTRUDER EXTRUDER={ext_name}
    M83
    {% set distance = get_variable("requested_extrude_distance") %}
    G1 E{distance} F400
    RESTORE_GCODE_STATE NAME=state_extrude_requested_amount
    {% do switch_page("RotDist_Results") %}
    M300 S255 P50
    G4 P500
    M300 S255 P50
    {% endif %}
  {% endif %}
run_as_gcode: true

[t5uid1_var __scroll_index]
type: input
address: 0x2033
data_type: uint16
script:
  {% do set_variable("scroll_direction", data) %}
  {% set t5uid1 = printer.t5uid1 %}
  {% set scroll_direction = get_variable("scroll_direction") %}
  {% set scroll_index = get_variable("scroll_index") %}
  {% if scroll_direction == t5uid1.constants.scroll_down %}
    {% set increment = 1 %}
  {% else %}
    {% set increment = -1 %}
  {% endif %}
  {% set new_scroll_index = scroll_index + increment %}
  # per issue#51, for some reason, a value of scroll_index less than -5 does not work
  {% if new_scroll_index < -5 %}
    {% set new_scroll_index = -5 %}
  {% endif %}
  {% do set_variable("scroll_index", new_scroll_index) %}
  {% do start_routine("trigger_full_update") %}


