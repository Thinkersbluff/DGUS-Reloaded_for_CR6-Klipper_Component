# NB: 1. Per DWIN App Dev Guide - Must write text 3 bytes AFTER actual variable pointer!!
#     2. Although DWIN_SET field is left-justified, still don't get first couple of letters unless Right justify in the format instruction??
#     3. Max # of characters that fit on 272-pixel screen = 26
#     4. Max specifiable field length = 32 characters, forced by T5UID1 messaging code, somewhere...
#     TODO: Consider how to split longer filenames into chunks & display on a rotating basis??
address: 0x31C1
data_type: str
data_len: 32
script:
  {% if printer.print_stats.filename %}
    { (printer.print_stats.filename|trim) }
  {% else %}
    {"No name passed by slicer"}    
  {% endif %}

[t5uid1_var tot_duration]
type: output
address: 0x31e1
data_type: str
data_len: 15
script:
  {% if get_duration(printer.print_stats.total_duration) %}
    { get_duration(printer.print_stats.total_duration) }
  {% else %}
    {"Not working"}    
  {% endif %}

[t5uid1_var get_abl_green_threshold]
type: output
address: 0x31FB
data_type: uint16
script:
  {% set abl_green_threshold = (printer['t5uid1']._threshold * 1000)|int %}
  { abl_green_threshold }

[t5uid1_var green_threshold_label]
type: output
address: 0x3200
data_type: str
data_len: 16
script:  {"Green Threshold:"}

[t5uid1_var status_remaining]
type: output
address: 0x4030
data_type: str
data_len: 15
script: { get_remaining(printer.t5uid1.time_remaining) }

[t5uid1_var fan_speed]
type: output
address: 0x4000
data_type: uint16
script:
  {% if 'fan' in printer %}
    { (printer.fan.speed * 100)|round|int }
  {% else %}
    { "0" }
  {% endif %}

[t5uid1_var LED_State]
type: output
address: 0x4001
data_type: uint16
script:
  { (printer["output_pin hotend_LED"].value)|int }

[t5uid1_var RunoutSensor_State]
type: output
address: 0x4002
data_type: uint16
script:
  {% if printer['filament_motion_sensor RunoutSensor'] is defined %}
    { (printer['filament_motion_sensor RunoutSensor'].enabled)|int }
  {% elif printer['filament_switch_sensor RunoutSensor'] is defined %}
    { (printer['filament_switch_sensor RunoutSensor'].enabled)|int }
  {% else %}
    {% do set_message("RunoutSensor not defined") %}
    { 0 }
  {% endif %}

[t5uid1_var Auto-Unload_State]
type: output
address: 0x402A
data_type: uint16
script: 
# {% if not 'save_variables' in printer %}
  #{% do set_message("[save_variables] not found") %}
# {% else %}
  {% set auto_unload_flag = get_variable("unload_filament_after_print") %}
    { auto_unload_flag }

[t5uid1_var print_this_file]
type: output
address: 0x4007
data_type: str
data_len: 32
script: 
  # Retrieve the current scroll_index
  # Capture the filename of the corresponding file displayed at the center of the scrolling list
  # Save the filename in the variable for retrieval by the __repeat_last_print routine, if the Print button is pressed
  # Send the filename to the display, to be displayed above the Print button
  {% set scroll_index = get_variable("scroll_index") %}
  {% set tapped_index = get_variable("tapped_index") %} 
  {% set print_this_file = specific_fpname(tapped_index, scroll_index)|trim %}
  {% do set_variable("print_file_name", print_this_file)  %}
  { (print_this_file) }

[t5uid1_var run_this_macro]
type: output
address: 0x4213
data_type: str
data_len: 32
script: 
  # Retrieve the current macro_index
  # Capture the name of the corresponding macro displayed at the cursor position
  # Save the macro's name in the variable for retrieval by the __run_selected_macro routine, if the Run Macro button is pressed
  # Send the macro's name to the display, to be displayed above the Run Macro button
  {% set macro_menu_index = get_variable("macro_menu_index") %}
  {% set run_this_macro = specific_mpname(0, macro_menu_index)|trim %}

  {% if run_this_macro == "None" or run_this_macro == "" %}
    {% set selected_macro_name = "No macro selected" %}
    {% do set_variable("run_this_macro", M300)  %}
  {% elif run_this_macro not in printer['gcode'].commands %}
    {% set selected_macro_name = "Macro not registered" %}
    {% do set_variable("run_this_macro", M300)  %}
  {% else %}
    {% set selected_macro_name = run_this_macro %}
    {% do set_variable("run_this_macro", selected_macro_name)  %}
  {% endif %}
  { (selected_macro_name) }

