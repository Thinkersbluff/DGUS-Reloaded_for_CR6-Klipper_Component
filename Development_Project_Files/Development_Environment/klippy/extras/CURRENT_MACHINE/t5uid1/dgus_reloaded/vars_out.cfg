[t5uid1_var level_auto_grid]
type: output
address: 0x3020
data_type: array[int16]
array_len: 25
script:
  {% if 'bed_mesh' in printer %}
    {% set grid = printer.bed_mesh.probed_matrix %}
  {% endif %}
  {% if grid is not defined or grid|length < 5 %}
    {% set grid = [] %}
    {% for i in range(5) %}
      {% do grid.append([0, 0, 0, 0, 0]) %}
    {% endfor %}
  {% endif %}
  {% do set_variable("mesh_points", grid)  %}
  {% for line in grid %}
    {% for val in line %}
      { (val * 1000)|round|int },
    {% endfor %}
  {% endfor %}

