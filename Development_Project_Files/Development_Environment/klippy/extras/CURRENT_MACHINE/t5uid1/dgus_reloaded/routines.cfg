  {% do set_variable("filament_length", 150) %}

[t5uid1_routine __filament_paused]
trigger: enter_pre
page: paused_print_adjust
script:
  {% set t5uid1 = printer.t5uid1 %}
  {% do set_variable("filament_extruder", t5uid1.constants.extruder_current) %}
  {% do set_variable("filament_length", 150) %}

# Lookup preset temps based on current filament type --- #
#  - Fallback to PLA defaults, if filament type is not recognized #
# Store those values in variables, so that they can be used as defaults on the PID tuning page, and also used to pre-populate the temp fields on the PID tuning page
# Pre-Populate the variables for the PID page --- #
[t5uid1_routine __pid]
trigger: enter_pre
page: pid
script:
  {% set t5uid1 = printer.t5uid1 %}
  {% set ftype = get_variable("current_filament_type")|int %}

   {% if ftype == 1 %}
    {% set nozzle_temp = get_preset_values('filament_type_1_default_nozzle_temp', t5uid1.constants.temp_pla.hotend) %}
    {% set bed_temp    = get_preset_values('filament_type_1_default_bed_temp',    t5uid1.constants.temp_pla.bed) %}

  {% elif ftype == 2 %}
    {% set nozzle_temp = get_preset_values('filament_type_2_default_nozzle_temp', t5uid1.constants.temp_abs.hotend) %}
    {% set bed_temp    = get_preset_values('filament_type_2_default_bed_temp',    t5uid1.constants.temp_abs.bed) %}

  {% elif ftype == 3 %}
    {% set nozzle_temp = get_preset_values('filament_type_3_default_nozzle_temp', t5uid1.constants.temp_petg.hotend) %}
    {% set bed_temp    = get_preset_values('filament_type_3_default_bed_temp',    t5uid1.constants.temp_petg.bed) %}

  {% else %}

    {% set nozzle_temp = get_preset_values('filament_type_1_default_nozzle_temp', t5uid1.constants.temp_pla.hotend) %}
    {% set bed_temp    = get_preset_values('filament_type_1_default_bed_temp',    t5uid1.constants.temp_pla.bed) %}
  {% endif %}

  {% do set_variable("default_hotend_pid_temp", nozzle_temp) %}
  {% do set_variable("default_bed_pid_temp", bed_temp) %}

  {% do set_variable("pid_heater", t5uid1.constants.heater_h0) %}
  {% do set_variable("pid_temp", nozzle_temp) %}

[t5uid1_routine __info]
trigger: enter_pre
page: info
script: {% do set_variable("debug_count", 0) %}

[t5uid1_routine __calibrate_rotation_distance]
trigger: enter_pre
page: RotDist_Test
script:
  {% if is_busy() %}
    {% do set_message("Busy") %}
    { abort_page_switch() }
  {% else %}
    {% set t5uid1 = printer.t5uid1 %}
    {% set current_rotation_dist = (get_printer_cfg_value("extruder", "rotation_distance") or "0.000") %}
    {% set ftype = get_variable("current_filament_type")|int %}
    {% if ftype == 1 %}
      {% set minimum_extrude_temp = get_preset_values('filament_type_1_min_extrude_temp',
                                                  t5uid1.constants.temp_pla.min_extrude)|int %}
    {% elif ftype == 2 %}
      {% set minimum_extrude_temp = get_preset_values('filament_type_2_min_extrude_temp',
                                                  t5uid1.constants.temp_abs.min_extrude)|int %}
    {% elif ftype == 3 %}
      {% set minimum_extrude_temp = get_preset_values('filament_type_3_min_extrude_temp',
                                                  t5uid1.constants.temp_petg.min_extrude)|int %}
    {% else %}
       M117 No filament type selected
       {% set minimum_extrude_temp = 0 %}
    {% endif %}

    {% if current_rotation_dist == 0 %}
      # Display Error message on printer LCD
      M117 "not found: extruder rotation distance"
    {% elif minimum_extrude_temp == 0 %}
      # Display Error message on printer LCD
      M117 "not found: min extrusion temp"
    {% else %}
      {% do set_variable("current_rotation_distance", current_rotation_dist) %}
      {% do set_variable("min_extrusion_temp", minimum_extrude_temp) %}
      M117 Min_Extrude_Temp = { get_variable("min_extrusion_temp") }C
      # Set default to speed workflow
      {% do set_variable("requested_extrude_distance", 100)|int %}
      # Set default to speed workflow
      {% do set_variable("initial_mark_distance", 120)|int %}
      # set default to avoid "not defined" errors on 1st load of results page
      {% do set_variable("subsequent_mark_distance", 20)|int %}
      # set default to avoid "not defined" errors on 1st load of results page 
      {% do set_variable("extrusion_path", 1)|int %}
      # Refresh displayed variables on page (maybe redundant?)    
      {% do start_routine("trigger_full_update") %}
      {% if printer.extruder.target|round|int < get_variable("min_extrusion_temp") %}
        M117 Set Temperature >= { get_variable("min_extrusion_temp") }C
      {% endif %}
    {% endif %}
  {% endif %}
run_as_gcode: true

[t5uid1_routine __test_rotation_distance]
trigger: enter_pre
page: RotDist_Results
script:
  {% if is_busy() %}
    {% do set_message("Busy") %}
    { abort_page_switch() }
  {% else %}
    {% do start_routine("compute_rotation_distance") %}
  {% endif %}

[t5uid1_routine compute_rotation_distance]
trigger: manual
script:
  {% if is_busy() %}
    {% do set_message("Busy") %}
    { abort_page_switch() }
  {% else %}
    {% set current_rotation_dist = (get_printer_cfg_value("extruder", "rotation_distance")) %}
    {% do set_variable("current_rotation_distance", current_rotation_dist) %}
    {% set previous_rotation_dist = get_variable("current_rotation_distance") | float %}
    {% set requested_extrude_dist = get_variable("requested_extrude_distance") | float %}
    {% set initial_mark_dist = get_variable("initial_mark_distance") | float %}
    {% set subsequent_mark_dist = get_variable("subsequent_mark_distance") | float %}
    {% set subsequent_mark_dist_display = (subsequent_mark_dist | round(1) * 10) | int %}
    {% do set_variable("subsequent_mark_distance_display", subsequent_mark_dist_display) %}

    {% set actual_extrude_dist = initial_mark_dist - subsequent_mark_dist | float %}
    {% set new_rotation_dist = (previous_rotation_dist * actual_extrude_dist / requested_extrude_dist) | round(3) %}
    {% do set_variable("new_rotation_distance", new_rotation_dist) %}
  {% endif %}
  run_as_gcode: true

[t5uid1_routine debounce_control]
trigger: manual
script:
  {% set time_now = get_now() %}
  {% set last_time = get_variable("last_debounce_time", 0.0) %}
  {% set debounce_interval = get_variable("debounce_interval") %} 

  {% if time_now - last_time > debounce_interval %}
    {% do set_variable("last_debounce_time", time_now) %}
    {% set debounce = 0 %}
  {% else %}
    {% set debounce = 1 %}
  {% endif %}
  {% do set_variable("debounce", debounce) %}
  M118 now={( time_now )} last={( last_time )} debounce = {( debounce )}
run_as_gcode: true