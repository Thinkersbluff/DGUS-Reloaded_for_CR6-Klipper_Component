# Last Updated: 5 May 2026
#
# This file contains common pin mappings for the BIGTREETECH SKR CR6 # V1.0 motherboard. 

# See https://www.klipper3d.org/Config_Reference.html for an explanation of the parameters used in this file.

# IMPORTANT: TAILOR THIS FILE AND CALIBRATE YOUR PRINTER BEFORE TRYING TO PRINT ANY MODELS!!
# NOTE: Online Klipper documentation frequently refers to using "Octoprint Terminal" - Read that instead as saying use "Mainsail Console"
# I have done my best to annotate this file - which is specific to my printer - to help you adapt it to your own system
# Please read the comments carefully and NOTE that you should ALSO perform the following calibrations on your own system, to 
# automatically adjust some of the parameters:
# From the DWIN Calibrate menu:
#   PID Tune the HotEnd and Bed
# From the Mainsail CONSOLE:
#   With a cold bed and a cold clean nozzle  Set your Z-Offset, per: https://www.klipper3d.org/Probe_Calibrate.html#calibrating-probe-z-offset
#   Run RUN_ABL_COLD
#   Run RUN_ABL_BED_60  (Expect a 5 minute delay before probing starts, to let the bed heatsoak and stabilize dimensionally.)
#   Run RUN_ABL_BED_80  (Expect a 5 minute delay before probing starts, to let the bed heatsoak and stabilize dimensionally.)
#  Optionally (recommended):
#   Calibrate your printer's pressure advance per: https://www.klipper3d.org/Pressure_Advance.html

###############################################################
######## Include Settings #####################################
#####(See also * Probe Settings *) ############################

[include mainsail.cfg]

[include DGUS-Reloaded.cfg]

[include CR6.cfg]

# IF you do not have moonraker timelapse installed, comment out this optional cfg:
[include timelapse.cfg]

# IF you do not want to use the Dev_Macros, you can comment out this optional cfg:
[include Dev_Macros.cfg]

# You may want to comment-out this include instruction, until you have completed the Resonance Compensation process referenced in InputShaper.cfg
[include inputShaper.cfg]
# NOTES: 
# 1. When input Shaper is correctly calibrated for your printer, the max_accel and max_accel_to_decel values can be increased. 
# 2. Without additional tuning, max_accel can be safely increased to 1500 and max_accel_to_decel to 750

# [include bigtreetech-adxl345-v2.0.cfg]

#ONLY uncomment ONE of the following include statements:
#[include runout_switch_sensor.cfg]  #Uncomment this one, if using the stock (or similar) switch-type runout sensor
[include runout_motion_sensor.cfg]  #Uncomment this one, if using a BTT SFS1.0 smart filament sensor

###############################################################
######## Configuration Settings ###############################
###############################################################

# Stepper Motor Settings #

# NOTE: If yours is a CR6-MAX printer, adjust the position_max values here, in the bed mesh profiles at the bottom of this file, and in DGUS-Reloaded.cfg
[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 32
rotation_distance: 40
endstop_pin: PC0
position_min: 0
position_endstop: 0
position_max: 235
homing_speed: 50
full_steps_per_rotation: 400

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
run_current: 0.65
#hold_current: 0.450
stealthchop_threshold: 0
uart_address: 0
interpolate: True

# NOTE: Test printer uses a 0.9 degree motor for the Y axis.
# If you have the stock 1.8 deg motor, change full_steps_per_rotation to 200
[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 32
rotation_distance: 40
endstop_pin: PC1
position_min: 0
position_endstop: 0
position_max: 235
homing_speed: 50
full_steps_per_rotation: 400

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.65
#hold_current: 0.450
stealthchop_threshold: 0
interpolate: True

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 32
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -1.5
position_max: 250
homing_speed: 4
second_homing_speed: 1
homing_retract_dist: 0.8
full_steps_per_rotation: 200

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.50
#hold_current: 0.450
stealthchop_threshold: 0
interpolate: True


# Probe Settings #

# If you are using the stock strain gauge probe (true for most users), keep this include statement
[include stockprobe.cfg]

# BUT if you have converted your CR6 to use a BTT microprobe instead of the stock strain gauge, comment-out the [include stockprobe.cfg] section above and uncomment this include statement
#[include microprobe.cfg]

# Keep this [probe] section here, to enable Klipper to SAVE_CONFIG your z_offset value,
# Calibrate your Z Offset per: https://www.klipper3d.org/Probe_Calibrate.html#calibrating-probe-z-offset

[probe]
#z_offset: -0.15


# Extruder and HotEnd Settings #

# NOTE: if you have a geared extruder like the Orbiter, you may need to remove the ! from the dir_pin setting, to reverse the motor direction
# (I installed my Orbiter while still running Marlin and reversed the motor by switching two wires in the connector, so !PB4 works on my test printer.)
[extruder]
max_extrude_only_distance: 200.0

max_extrude_cross_section: 5 # mm^2  NOTE: 5 mm² is the community-standard “safe but never intrusive” value for high-flow hotends.
# CAUTION: Set max_extrude_cross_section to 2, for stock CR6 hotend

max_extrude_only_velocity: 25 # mm/s  NOTE: 25 mm/s is a “safe maximum” that still feels fast.
# CAUTION: Set max_extrude_only_velocity to 15 for stock CR6 hotend

max_extrude_only_accel: 4000 # mm/s/s
# CAUTION: Set max_extrude_only_accel to 500 for stock CR6 hotend.

step_pin: PB3
dir_pin: !PB4    # NOTE: You will need to remove the ! from this setting, if your extruder runs backwards
enable_pin: !PD2
microsteps: 32
instantaneous_corner_velocity: 5

# NOTE: Test Printer uses an Orbiter v1.5 extruder in a Direct Drive configuration
#  If you have the stock extruder - Comment-Out the Orbiter settings and uncomment the stock extruder rotation distance
#  If you have the BMG or BMG clone extruder - Comment-Out the Orbiter settings and uncomment the two BMG settings
#  If you have any other extruder, you will need to find the correct settings and insert them here. Comment-Out the Orbiter settings.
# stock extruder
# rotation_distance: 30.4768

# Orbiter extruder
gear_ratio: 7.5:1
rotation_distance : 35.800

# BMG extruder
# gear_ratio: 51:17
# rotation_distance: 23.132

# If you are using a different nozzle diameter, edit this parameter
nozzle_diameter: 0.400

filament_diameter: 1.750
heater_pin: PC8

# If your thermistor is stock (= NTC100k = Marlin Type 1), comment-out the PT1000 and uncomment one of the 100K settings 
# (Try the EPCOS first, as that is the most common 100K thermistor used in 3D printers, and is more likely to work with the stock CR6 thermistor)
sensor_type: PT1000  
#sensor_type: EPCOS 100K B57560G104F
#sensor_type: Generic 3950 #100K NTC thermistor

sensor_pin: PA0

# PID-Tune your Nozzle heater using the Calibrate-> PID Tuning menu and SAVE_CONFIG
#control: pid
#pid_Kp: 27.290
#pid_Ki: 1.784
#pid_Kd: 104.383
min_temp: 10

# If you are not using an all-metal hotend capable of 320 deg, edit this parameter accordingly
# e.g. A stock Bowden hotend should be limited to 260 max
max_temp: 320  ; Using DragonHF hotend
min_extrude_temp: 180

# Calibrate your printer's pressure advance per: https://www.klipper3d.org/Pressure_Advance.html
# and edit this setting. (NOTE You can also override this setting in your slicer, if available, on a per-filament basis)
# pressure_advance: 0.020 # Sakata PETG
# pressure_advance: 0.038 # Prusa PETG
# pressure_advance: 0.048 # Overture Transparent PETG
# pressure_advance: 0.025 # Silk PLA
# pressure_advance: 0.015 # Matte PLA
pressure_advance: 0.025 # Polyterra Charcoal Black PLA

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.6  # Verify this is a suitable RMS current value for your extruder motor, if it is not stock...
#hold_current: 0.4
stealthchop_threshold: 0

# Bed Heater Settings #

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC3
min_temp: 0
max_temp: 120

# PID-Tune your Heater Bed using the Calibrate-> PID Tuning menu and SAVE_CONFIG
control: pid
pid_Kp: 70
pid_Ki: 1
pid_Kd: 1000


# Miscellaneous Settings #

[firmware_retraction]
#NOTE: These settings are only used if the slicer is configured to "Use firmware retraction".
# [Verify G-code contains G10/G11, to confirm the slicer is using firmware retraction.]

retract_length: 0.45
#   The length of filament (in mm) to retract when G10 is activated,
#   and to unretract when G11 is activated (but see
#   unretract_extra_length below). The default is 0 mm.
retract_speed : 40
#   The speed of retraction, in mm/s.
#     The Klipper default is 20 mm/s. Orbiter v1.5 = 120 mm/s
unretract_extra_length : 0.0
#   The length (in mm) of *additional* filament to add when
#   unretracting.
unretract_speed : 40
#   The speed of unretraction, in mm/s. 
#     The Klipper default is 10 mm/s. Orbiter v1.5 = 120 mm/s

[tuning_tower]

[fan]
pin: PC6
hardware_pwm: True
kick_start_time: 0.5

[controller_fan mainboard_fan]
pin: PC7

[output_pin hotend_LED]
pin: PA13
value: 0  ; set LED off by default, at power up

# You may need to edit the serial value - See: https://www.klipper3d.org/FAQ.html?h=serial#wheres-my-serial-port
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_30FFDB054254353915721557-if00
restart_method: command

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 10
max_temp: 100

[temperature_sensor Klipper_Host_MCU]
sensor_type: temperature_host
min_temp: 10
max_temp: 100 

# Comment-out these next two values, or edit them, using QUERY_ADC NAME-'temperature_mcu mcu_temp' to obtain the sensor_adc1 value 
# and use an independent temperature sensor (e.g. bed or nozzle?) to estimate the actual mcu temperature, while everything is at room ambient temp.
#sensor_temperature1: 23
#sensor_adc1: 0.428022

# Kinematics Settings #

# NOTE: Reduce these velocity and acceleration values if NOT using InputShaper
[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3500
MINIMUM_CRUISE_RATIO: 0.5
square_corner_velocity: 10 # Reduce to 3 or less if not using Input Shaper (Klipper default is 1)
max_z_velocity: 20
max_z_accel: 150

#buffer_time_high: 10  ;uncomment this setting if printer seems to need a larger communications buffer while printing

[gcode_arcs] # Enables support for G1/G2 from slicer (e.g. from arc welder)
resolution: 1.0
[static_digital_output usb_pullup_enable]
pins: !PA14


####################################
#  ENABLE exclude_object function  #
####################################
[exclude_object]

####################################
#  ENABLE respondfunction  #
####################################
[respond]
default_type: error
default_prefix: 
###############################################################
############### END OF CONFIGS ################################
