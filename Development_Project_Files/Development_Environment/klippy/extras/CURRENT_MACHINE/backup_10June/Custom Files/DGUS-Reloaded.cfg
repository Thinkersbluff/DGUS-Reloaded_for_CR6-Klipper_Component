[t5uid1]
# Configured to describe the CR6-SE test printer
firmware: dgus_reloaded
# software_version: D-R_CR6_v1.2.9
machine_name: CR6-SE_Klipper
#   The machine name shown on the information page.
brightness: 100
#   The default brightness for the touchscreen (as a value from 0 to 100).
boot_sound: -1
#   Disable music playback (The CR6 DWIN display has a buzzer, not a speaker, it can not support music playback)
volume: 100
#   The default volume for the touchscreen buzzer (as a value from 0 to 100).
x_min: -2  # My printer's nozzle happens to be ~2mm to the left of the bed, when homed.
#   This can be used to provide a lower limit (in mm) to X moves done using the
#   touschreen. Movements will still be limited by your [stepper_x]
#   configuration values.
x_max: 235
#   This can be used to provide an upper limit (in mm) to X moves done using the
#   touschreen. Movements will still be limited by your [stepper_x]
#   configuration values.
y_min: -2.1  # I happen to be chasing a bug in which the printer sometimes throws a "movemement out of range" error with the Y location = -2.006mm...
#   Same as x_min for the Y axis.
y_max: 235
#   Same as x_max for the Y axis.
z_min: 0
#   Same as x_min for the Z axis.
z_max: 250
#   Same as x_max for the Z axis.

# NOTE: As of v1.3.6 of the DGUS-Reloaded Klipper Component, Material Presets are stored in presets.cfg and can be managed via the SetUp menu or by editing the presets.cfg text file.
# The original Material temperature preset values are still also defined in dgus_reloaded/__init__.py, as follows:
#    'temp_pla': {
#        'hotend': 210,
#        'bed': 60
#    },
#    'temp_abs': {
#        'hotend': 240,
#        'bed': 90
#    },
#    'temp_petg': {
#        'hotend': 225,
#        'bed': 80
#    },
# Those original values remain the defaults, if there are no values defined in presets.cfg. You can edit that file, to change these values.  
#
########################################################################
# Macros to manage the contents of variables.cfg

[save_variables]
filename: /home/pi/klipper/klippy/extras/t5uid1/dgus_reloaded/variables.cfg

####################################
# PAUSE_STOP control macros
[gcode_macro SET_DISABLE_PAUSE_STOP]
description: Saves a control variable tested by dgus_reloaded vars_in.cfg before processing PAUSE and STOP commands
gcode: 
    {% set svv = printer.save_variables.variables %}
    SAVE_VARIABLE VARIABLE=disable_pause_stop VALUE=True
    M117 PAUSE and STOP suspended

[gcode_macro CLEAR_DISABLE_PAUSE_STOP]
description: Saves a control variable tested by dgus_reloaded vars_in.cfg before processing PAUSE and STOP commands
gcode: 
    {% set svv = printer.save_variables.variables %}
    SAVE_VARIABLE VARIABLE=disable_pause_stop VALUE=False
    M117 PAUSE and STOP restored

###################################
# Countdown Timer control macros
[gcode_macro START_COUNTDOWN_TIMER]
description: Saves a control variable tested by dgus_reloaded vars_out.cfg before updating the Estimated Print Time Remaining parameter
gcode: 
    {% set svv = printer.save_variables.variables %}
    SAVE_VARIABLE VARIABLE=start_countdown_timer VALUE=True

[gcode_macro STOP_COUNTDOWN_TIMER]
description: Saves a control variable tested by dgus_reloaded vars_out.cfg before updating the Estimated Print Time Remaining parameter
gcode: 
    {% set svv = printer.save_variables.variables %}
    SAVE_VARIABLE VARIABLE=start_countdown_timer VALUE=False

################################################
# Filament RunOut Sensor control Macros
[gcode_macro RUNOUT_ON]
description: Enables the Filament Runout Sensor
gcode:
  SET_FILAMENT_SENSOR_BASE SENSOR=RunoutSensor ENABLE=1
  {% set svv = printer.save_variables.variables %}
  SAVE_VARIABLE VARIABLE=enable_runout_sensor VALUE=1
  REPORT_FILAMENT_SENSOR_ENABLE_STATUS

[gcode_macro RUNOUT_OFF]
description: Disables the Filament Runout Sensor
gcode:
  SET_FILAMENT_SENSOR_BASE SENSOR=RunoutSensor ENABLE=0
  {% set svv = printer.save_variables.variables %}
  SAVE_VARIABLE VARIABLE=enable_runout_sensor VALUE=0
  REPORT_FILAMENT_SENSOR_ENABLE_STATUS

[gcode_macro SET_FILAMENT_SENSOR]
description: Automatically sets the filament sensor on/off, based on Saved variable enable_runout_sensor in variables.cfg
rename_existing: SET_FILAMENT_SENSOR_BASE
gcode:
  {% set svv = printer.save_variables.variables %}
  {% if svv.enable_runout_sensor==0 %}
    RUNOUT_OFF
  {% elif svv.enable_runout_sensor==1 %}
    RUNOUT_ON
  {% endif %}

[gcode_macro DGUS_FILAMENT_MOVE]
gcode:
  # All Jinja2 here runs at GCode EXECUTION time, not at queue time
  {% set ext_name = params.EXTRUDER %}
  {% set length = params.LENGTH | float %}
  {% set direction = params.DIRECTION %}
  {% set min_temp = printer.configfile.settings[ext_name].min_extrude_temp %}
  {% if not printer[ext_name].can_extrude %}
    {% set msg1 = "Nozzle: %dC < %dC" % (printer[ext_name].temperature|int, min_temp|int) %}
    {% set msg2 = "Nozzle too cold: %dC < %dC minimum" % (printer[ext_name].temperature|int, min_temp|int) %}
    DGUS_SET_MESSAGE MSG="{msg1}"
    RESPOND TYPE=error MSG="{msg2}"
    M300 S880 P255
  {% elif printer[ext_name].target < min_temp %}
    {% set msg1 = "Heater target %dC < %dC" % (printer[ext_name].target|int, min_temp|int) %}
    {% set msg2 = "Heater target %dC < %dC minimum - heat nozzle first" % (printer[ext_name].target|int, min_temp|int) %}
    DGUS_SET_MESSAGE MSG="{msg1}"
    RESPOND TYPE=error MSG="{msg2}"
    M300 S880 P255
  {% else %}
    SAVE_GCODE_STATE NAME=state_filament_move
    ACTIVATE_EXTRUDER EXTRUDER={ext_name}
    M83
    {% if direction == "retract" %}
      G1 E5 F300
      G1 E-{length} F1800
    {% elif direction == "extrude" %}
      G1 E{length} F400
    {% endif %}
    RESTORE_GCODE_STATE NAME=state_filament_move
  {% endif %}